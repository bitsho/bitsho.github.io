<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HistoTrivia — 历史时间线挑战</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--ink2:#3d2e12;--ink3:#6b5132;
  --paper:#f5eed8;--paper2:#ede4c6;--paper3:#e0d4ae;
  --accent:#8b2800;--accent2:#b84a1a;--gold:#c49a2a;
  --border:rgba(26,18,8,0.2);--shadow:rgba(26,18,8,0.15);
}
html,body{height:100%;overflow:hidden}
body{background:var(--paper3);font-family:'EB Garamond',Georgia,serif;color:var(--ink)}

/* ══ PORTAL ══ */
#portal{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--paper3);
  background-image:
    radial-gradient(ellipse at 15% 40%,rgba(196,154,42,.08) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 25%,rgba(139,40,0,.06) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 82%,rgba(196,154,42,.05) 0%,transparent 60%);
  z-index:10;padding:.25rem;overflow-y:auto;
}
.portal-inner{width:100%;max-width:700px;display:flex;flex-direction:column;align-items:center;gap:1.4rem;zoom:1.5;}

/* Parchment frame */
.pframe{
  width:100%;border:1.5px double var(--border);border-radius:6px;
  padding:2rem 2.5rem;background:rgba(245,238,216,.65);
  box-shadow:0 4px 28px var(--shadow),inset 0 1px 0 rgba(255,255,255,.55);
  position:relative;
}
.pframe::before{content:'';position:absolute;inset:8px;border:.5px solid rgba(196,154,42,.3);border-radius:3px;pointer-events:none}
.pframe::after{
  content:'§';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  background:var(--paper3);padding:0 .9rem;
  font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold);
}
.corner{position:absolute;width:20px;height:20px;border-color:var(--gold);border-style:solid;opacity:.45}
.c-tl{top:14px;left:14px;border-width:2px 0 0 2px}
.c-tr{top:14px;right:14px;border-width:2px 2px 0 0}
.c-bl{bottom:14px;left:14px;border-width:0 0 2px 2px}
.c-br{bottom:14px;right:14px;border-width:0 2px 2px 0}

/* Header */
.logo{text-align:center;padding-bottom:1.1rem;margin-bottom:1.3rem;border-bottom:1px solid var(--border)}
.logo-main{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3rem);font-weight:700;color:var(--accent);letter-spacing:.06em;line-height:1}
.logo-main span{color:var(--gold)}
.logo-sub{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-style:italic;margin-top:.3rem}
.logo-sub em{font-style:normal;color:var(--gold)}

/* 2×2 grid */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;width:100%}
.gc{
  cursor:pointer;background:var(--paper);border:1px solid var(--border);
  border-radius:5px;padding:1.15rem 1rem .9rem;text-align:center;position:relative;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  box-shadow:0 2px 6px var(--shadow);overflow:hidden;
  user-select:none;
}
.gc::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.38) 0%,transparent 50%);pointer-events:none}
.gc:hover{transform:translateY(-3px);box-shadow:0 7px 22px var(--shadow);border-color:rgba(196,154,42,.6)}
.gc:active{transform:translateY(0)}
.gc.ultimate{border-color:rgba(139,40,0,.45);background:linear-gradient(145deg,var(--paper) 55%,rgba(139,40,0,.04))}
.gc.ultimate::after{content:'★';position:absolute;top:6px;right:8px;font-size:.85rem;color:var(--gold);opacity:.65}
.gc-icon{font-size:1.9rem;margin-bottom:.35rem;display:block;line-height:1}
.gc-name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:.08rem}
.gc-sub{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-style:italic;margin-bottom:.5rem}
.gc-diff{display:inline-block;font-size:.57rem;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:rgba(139,40,0,.07);color:var(--accent2);margin-bottom:.35rem}
.gc-score-row{display:flex;align-items:center;justify-content:center;gap:.4rem;padding-top:.45rem;border-top:.5px solid var(--border);margin-top:.1rem}
.gc-score-lbl{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.gc-score-val{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--accent)}
.gc-score-val.gold{color:var(--gold)}

/* Music bar */
.music-bar{
  display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;
  background:var(--paper);border:1px solid var(--border);border-radius:4px;
  width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.music-btn{
  font-size:1rem;color:var(--gold);cursor:pointer;user-select:none;
  transition:transform .2s,opacity .2s;border:none;background:none;padding:0;
  width:22px;text-align:center;
}
.music-btn:hover{transform:scale(1.2)}
.music-info{flex:1;min-width:0}
.music-name{font-size:.76rem;font-style:italic;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-comp{font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.vol-wrap{display:flex;align-items:center;gap:.3rem}
.vol-icon{font-size:.7rem;color:var(--ink3)}
.vol-slider{
  -webkit-appearance:none;appearance:none;width:72px;height:3px;
  background:var(--paper3);border-radius:2px;outline:none;cursor:pointer;border:none;
}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold);cursor:pointer;border:1px solid rgba(139,40,0,.3)}

.portal-foot{font-size:.7rem;color:var(--ink3);letter-spacing:.05em;font-style:italic;text-align:center}

/* ══ GAME SHELL ══ */
#game-shell{position:fixed;inset:0;display:none;flex-direction:column;z-index:20;background:#000}
#game-shell.active{display:flex}
#back-bar{
  display:flex;align-items:center;gap:.8rem;padding:.4rem .75rem;
  background:var(--paper);border-bottom:1px solid var(--border);
  box-shadow:0 1px 5px var(--shadow);z-index:30;flex-shrink:0;
}
.back-btn{
  font-family:'EB Garamond',serif;font-size:.78rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);cursor:pointer;
  padding:3px 10px;border:1px solid var(--accent);border-radius:2px;
  background:transparent;transition:all .15s;
}
.back-btn:hover{background:var(--accent);color:var(--paper)}
.bar-title{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--ink2)}
.bar-best{
  margin-left:auto;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);display:none;
}
.bar-best span{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--gold)}
#game-frame{flex:1;border:none;width:100%;min-height:0;display:block}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.portal-inner>*{animation:fadeUp .55s ease both}
.portal-inner>*:nth-child(1){animation-delay:.06s}
.portal-inner>*:nth-child(2){animation-delay:.18s}
.portal-inner>*:nth-child(3){animation-delay:.3s}
.portal-inner>*:nth-child(4){animation-delay:.4s}

@media(max-width:480px){
  .pframe{padding:1.4rem 1rem}
  .game-grid{grid-template-columns:1fr}
  .logo-main{font-size:1.9rem}
}
</style>
</head>
<body>

<!-- ══════ PORTAL ══════ -->
<div id="portal">
  <div class="portal-inner">
    <div class="pframe">
      <div class="corner c-tl"></div><div class="corner c-tr"></div>
      <div class="corner c-bl"></div><div class="corner c-br"></div>

      <div class="logo">
        <div class="logo-main">Histo<span>Trivia</span></div>
        <div class="logo-sub">历史时间线挑战 · <em>选择你的战场</em></div>
      </div>

      <div class="game-grid">
        <div class="gc ultimate" onclick="launchGame('ultimate')">
          <span class="gc-icon">🌍</span>
          <div class="gc-name">终极挑战</div>
          <div class="gc-sub">Ultimate Challenge</div>
          <div class="gc-diff">最高难度</div>
          <div class="gc-score-row">
            <span class="gc-score-lbl">最高分</span>
            <span class="gc-score-val gold" id="sv-ultimate">—</span>
          </div>
        </div>

        <div class="gc" onclick="launchGame('world')">
          <span class="gc-icon">🗺️</span>
          <div class="gc-name">AP 世界史</div>
          <div class="gc-sub">World History: Modern</div>
          <div class="gc-diff">高难度</div>
          <div class="gc-score-row">
            <span class="gc-score-lbl">最高分</span>
            <span class="gc-score-val" id="sv-world">—</span>
          </div>
        </div>

        <div class="gc" onclick="launchGame('us')">
          <span class="gc-icon">🦅</span>
          <div class="gc-name">AP 美国史</div>
          <div class="gc-sub">U.S. History</div>
          <div class="gc-diff">中高难度</div>
          <div class="gc-score-row">
            <span class="gc-score-lbl">最高分</span>
            <span class="gc-score-val" id="sv-us">—</span>
          </div>
        </div>

        <div class="gc" onclick="launchGame('europe')">
          <span class="gc-icon">🏛️</span>
          <div class="gc-name">AP 欧洲史</div>
          <div class="gc-sub">European History</div>
          <div class="gc-diff">中高难度</div>
          <div class="gc-score-row">
            <span class="gc-score-lbl">最高分</span>
            <span class="gc-score-val" id="sv-europe">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="music-bar">
      <button class="music-btn" id="mbtn" onclick="toggleMusic()">♪</button>
      <div class="music-info">
        <div class="music-name">Canon in D Major — Pachelbel</div>
        <div class="music-comp">Johann Pachelbel · 公共领域录音</div>
      </div>
      <div class="vol-wrap">
        <span class="vol-icon">🔈</span>
        <input type="range" class="vol-slider" id="vol" min="0" max="100" value="30" oninput="setVol(this.value)">
      </div>
    </div>

    <div class="portal-foot">点击卡片开始游戏 · 刷新后最高分仍会保留</div>
  </div>
</div>

<!-- ══════ GAME SHELL ══════ -->
<div id="game-shell">
  <div id="back-bar">
    <button class="back-btn" onclick="returnPortal()">← 返回首页</button>
    <span class="bar-title" id="bar-title"></span>
    <span class="bar-best" id="bar-best">本局最高&nbsp;<span id="bar-best-val">—</span></span>
  </div>
  <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
</div>

<!-- Background music via Web Audio API (no external deps) -->

<script>
const GAME_ULTIMATE = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HistoTrivia — World History Timeline Game</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>



*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--ink2:#3d2e12;--ink3:#6b5132;
  --paper:#f5eed8;--paper2:#ede4c6;--paper3:#e0d4ae;
  --accent:#8b2800;--accent2:#b84a1a;--gold:#c49a2a;
  --correct:#2d6a2d;--correct-bg:#d4edda;
  --wrong:#8b2800;--wrong-bg:#f8d7da;
  --border:rgba(26,18,8,0.2);--shadow:rgba(26,18,8,0.15);
}
body{background:var(--paper3);background-image:radial-gradient(ellipse at 20% 50%,rgba(196,154,42,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(139,40,0,.05) 0%,transparent 50%);min-height:100vh;font-family:'EB Garamond',Georgia,serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;}
.page{width:100%;max-width:960px;padding:0 1rem 3rem;position:relative;z-index:1}

/* HEADER */
header{text-align:center;padding:1.5rem 0 1rem;border-bottom:1.5px double var(--border);margin-bottom:1rem}
.masthead{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;letter-spacing:.04em;color:var(--accent);line-height:1;margin-bottom:.2rem}
.tagline{font-size:.8rem;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;font-style:italic}

/* FILTER TABS */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:1rem;padding:.6rem;background:var(--paper);border:1px solid var(--border);border-radius:4px}
.filter-btn{font-family:'EB Garamond',serif;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border:1px solid var(--border);border-radius:2px;background:transparent;color:var(--ink3);cursor:pointer;transition:all .15s}
.filter-btn:hover{background:var(--paper2);color:var(--ink)}
.filter-btn.active{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.filter-count{font-size:.65rem;opacity:.7;margin-left:3px}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.2rem;background:var(--paper);border:1px solid var(--border);border-radius:4px;margin-bottom:.8rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.hud-score{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--accent)}
.hud-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:block}
.hud-streak{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:400;color:var(--gold)}
.hearts{display:flex;gap:5px;align-items:center}
.heart{width:20px;height:20px;transition:all .3s;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.heart.lost{opacity:.2;filter:grayscale(1)}

/* PROGRESS */
.progress-wrap{height:3px;background:var(--paper3);border-radius:2px;overflow:hidden;margin-bottom:.8rem;border:.5px solid var(--border)}
.progress-bar{height:100%;background:var(--gold);transition:width .4s ease}

/* CHALLENGE CARD */
.challenge-area{text-align:center;margin-bottom:1.2rem}
.challenge-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.5rem}
.challenge-card{display:inline-flex;align-items:stretch;background:var(--paper);border:1px solid var(--border);border-radius:6px;max-width:560px;width:100%;box-shadow:0 2px 8px var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);overflow:hidden;position:relative;text-align:left}
.card-img-wrap{width:120px;flex-shrink:0;background:var(--paper2);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:110px}
.card-img{width:120px;height:100%;object-fit:cover;display:none}
.card-img.loaded{display:block}
.card-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:110px;background:linear-gradient(135deg,var(--paper2) 25%,var(--paper3) 50%,var(--paper2) 75%);background-size:200% 200%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.card-img-placeholder svg{opacity:.2;width:32px;height:32px}
.card-body{padding:.8rem 1rem;flex:1}
.card-title{font-family:'Playfair Display',serif;font-size:clamp(.9rem,2.2vw,1.1rem);font-weight:700;line-height:1.3;color:var(--ink)}
.card-hint{font-size:.75rem;color:var(--ink3);margin-top:.3rem;font-style:italic}
.card-year-mystery{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--accent2);margin-top:.4rem;letter-spacing:.12em}
.card-region-badge{display:inline-block;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(139,40,0,.08);color:var(--accent);border-radius:2px;padding:1px 5px;margin-top:.3rem}

/* INSTRUCTION */
.instruction{text-align:center;font-style:italic;font-size:.88rem;color:var(--ink3);margin-bottom:.8rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* TIMELINE */
.timeline-wrapper{overflow-x:auto;padding-bottom:1rem;-webkit-overflow-scrolling:touch}
.timeline{display:flex;align-items:center;min-height:155px;padding:.5rem 1rem;position:relative;min-width:max-content}
.timeline-line{position:absolute;top:50%;left:0;right:0;height:1.5px;background:linear-gradient(to right,transparent,var(--ink3) 5%,var(--ink3) 95%,transparent);transform:translateY(-50%);pointer-events:none}

/* TL CARD */
.tl-card{position:relative;z-index:2;background:var(--paper);border:1px solid var(--border);border-radius:5px;width:115px;text-align:center;font-size:.72rem;box-shadow:0 1px 4px var(--shadow);flex-shrink:0;transition:transform .2s,box-shadow .2s;overflow:hidden}
.tl-thumb{width:115px;height:60px;object-fit:cover;display:block;background:var(--paper2)}
.tl-thumb-ph{width:115px;height:60px;background:var(--paper2);display:flex;align-items:center;justify-content:center}
.tl-body{padding:.35rem .4rem}
.tl-card-year{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--accent);display:block;margin-bottom:1px}
.tl-card-title{font-size:.65rem;line-height:1.25;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-card-wiki{display:block;margin-top:3px;font-size:.6rem;color:var(--accent2);text-decoration:none;font-style:italic}
.tl-card-wiki:hover{text-decoration:underline}
.tl-card.correct{border-color:var(--correct);animation:correctFlash .5s ease}
.tl-card.wrong{border-color:var(--wrong);background:var(--wrong-bg);animation:shake .4s ease}
@keyframes correctFlash{0%{transform:scale(1.12);box-shadow:0 0 0 4px rgba(45,106,45,.3)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* INSERT ZONE */
.insert-zone{width:32px;height:80px;flex-shrink:0;position:relative;z-index:3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:width .15s}
.insert-zone:hover{width:48px}
.insert-btn{width:24px;height:24px;border-radius:50%;background:var(--paper);border:1.5px solid var(--accent2);color:var(--accent2);font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px var(--shadow);pointer-events:none}
.insert-zone:hover .insert-btn{background:var(--accent2);color:white;transform:scale(1.15);box-shadow:0 2px 6px rgba(139,40,0,.3)}
.insert-zone.disabled{pointer-events:none;opacity:.3}

/* FEEDBACK */
.feedback{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:.6rem 1.4rem;border-radius:4px;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.feedback.correct{background:#eaf5ea;color:var(--correct);border:1px solid var(--correct);opacity:1}
.feedback.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong);opacity:1}
.feedback.hide{opacity:0}

/* START SCREEN */
.overlay{position:fixed;inset:0;background:rgba(26,18,8,.8);z-index:200;display:flex;align-items:center;justify-content:center}
.overlay.hide{display:none}
.overlay-box{background:var(--paper);border:2px solid var(--border);border-radius:8px;padding:2rem 2.5rem;max-width:480px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4);position:relative;max-height:90vh;overflow-y:auto}
.overlay-box::before{content:'';position:absolute;inset:8px;border:.5px solid rgba(196,154,42,.4);border-radius:4px;pointer-events:none}
.overlay-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--accent);margin-bottom:.8rem}
.start-rules{font-size:.88rem;line-height:1.8;color:var(--ink2);margin-bottom:1.2rem;text-align:left}
.start-rules li{margin-bottom:.2rem}
.btn-primary{background:var(--accent);color:var(--paper);border:none;cursor:pointer;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;padding:.65rem 2rem;border-radius:4px;letter-spacing:.05em;transition:background .2s,transform .1s;margin:.3rem}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);cursor:pointer;font-family:'Playfair Display',serif;font-size:1rem;padding:.6rem 1.5rem;border-radius:4px;transition:all .2s;margin:.3rem}
.btn-secondary:hover{background:var(--paper2)}

/* GAME OVER */

// ── SOUND ENGINE ──────────────────────────────────────
const AC = window.AudioContext ? new AudioContext() : null;
function playSound(type) {
  if(!AC) return;
  if(AC.state==='suspended') AC.resume();
  const t = AC.currentTime;
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.connect(gain); gain.connect(AC.destination);
  if(type==='correct') {
    osc.type='sine';
    osc.frequency.setValueAtTime(523,t);
    osc.frequency.setValueAtTime(659,t+0.1);
    osc.frequency.setValueAtTime(784,t+0.2);
    gain.gain.setValueAtTime(0.18,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.start(t); osc.stop(t+0.5);
  } else if(type==='wrong') {
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(220,t);
    osc.frequency.setValueAtTime(180,t+0.1);
    gain.gain.setValueAtTime(0.12,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    osc.start(t); osc.stop(t+0.35);
  } else if(type==='tick') {
    osc.type='sine';
    osc.frequency.setValueAtTime(800,t);
    gain.gain.setValueAtTime(0.06,t);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    osc.start(t); osc.stop(t+0.05);
  } else if(type==='start') {
    [261,329,392,523].forEach((freq,i)=>{
      const o2=AC.createOscillator(), g2=AC.createGain();
      o2.connect(g2); g2.connect(AC.destination);
      o2.type='sine'; o2.frequency.value=freq;
      g2.gain.setValueAtTime(0.1,t+i*0.1);
      g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.3);
      o2.start(t+i*0.1); o2.stop(t+i*0.1+0.3);
    });
  } else if(type==='gameover') {
    [392,349,311,261].forEach((freq,i)=>{
      const o2=AC.createOscillator(), g2=AC.createGain();
      o2.connect(g2); g2.connect(AC.destination);
      o2.type='sine'; o2.frequency.value=freq;
      g2.gain.setValueAtTime(0.1,t+i*0.15);
      g2.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+0.4);
      o2.start(t+i*0.15); o2.stop(t+i*0.15+0.4);
    });
  }
}

function getTitle(ev){return currentLang==='zh'?ev.zh_title:ev.title;}

// ── POOL BUILDING ─────────────────────────────────────
function buildPool() {
  const isGlobal=currentRegion==='g';
  const [gcap,rcap]=DIFF_CAPS[currentDiff];
  const cap=isGlobal?gcap:rcap;
  let pool=EVENTS.filter(e=>e.regions.includes(currentRegion));
  pool.sort((a,b)=>b.importance-a.importance||a.year-b.year);
  return pool.slice(0,Math.min(cap,pool.length));
}

// ── GAME ──────────────────────────────────────────────
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame() {
  document.getElementById('startscreen').classList.add('hide');
  document.getElementById('gameover').classList.add('hide');
  hideReview();
  const pool=buildPool();
  deck=shuffle(pool);
  placed=[];score=0;streak=0;lives=3;locked=false;gameHistory=[];
  updateHUD();
  const el=document.getElementById('pool-size');if(el)el.textContent=pool.length;
  const first=deck.shift();
  placed.push(first);gameHistory.push({event:first,wasCorrect:true});
  renderTimeline();nextCard();updateUI();
  playSound('start');
}

function fmtYear(y){
  if(currentLang==='zh') return y<0?'公元前'+Math.abs(y)+'年':'公元'+y+'年';
  return y<0?Math.abs(y)+' BCE':y+' CE';
}

  ['score','pool','streak','lives'].forEach(k=>{const e=document.getElementById('hud-'+k+'-lbl');if(e)e.textContent=hl[k];});
}

const imgCache=new Map();
async function fetchWikiImage(wiki){
  if(imgCache.has(wiki))return imgCache.get(wiki);
  try{
    const title=wiki.replace(/_/g,' ');
    const url=\`https://en.wikipedia.org/w/api.php?action=query&titles=\${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=400&origin=*\`;
    const r=await fetch(url);
    const d=await r.json();
    const pages=d.query?.pages;
    const page=pages?Object.values(pages)[0]:null;
    const imgUrl=page?.thumbnail?.source||null;
    imgCache.set(wiki,imgUrl); return imgUrl;
  }catch{imgCache.set(wiki,null); return null;}
}

async function nextCard(){
  if(deck.length===0||lives===0){endGame();return;}
  current=deck.shift();
  document.getElementById('card-title').textContent=getTitle(current);
  document.getElementById('card-hint').textContent=getHint(current);
  const rn=currentLang==='zh'?REGION_NAMES_ZH:REGION_NAMES;
  document.getElementById('card-region-badge').textContent=rn[currentRegion]||currentRegion;
  locked=false;
  const img=document.getElementById('card-img'),ph=document.getElementById('card-img-ph');
  img.classList.remove('loaded');img.src='';ph.style.display='flex';
  fetchWikiImage(current.wiki).then(url=>{
    if(url&&current){img.src=url;img.onload=()=>{img.classList.add('loaded');ph.style.display='none';};}
  });
  renderTimeline();
}

function renderTimeline(){
  const tl=document.getElementById('timeline');tl.innerHTML='<div class="timeline-line"></div>';
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  if(!sorted.length){if(current&&!locked)addInsertZone(tl,0,null,null);return;}
  if(current&&!locked)addInsertZone(tl,0,null,sorted[0]);
  sorted.forEach((ev,i)=>{
    tl.appendChild(createTLCard(ev));
    if(current&&!locked&&i<sorted.length-1)addInsertZone(tl,i+1,sorted[i],sorted[i+1]);
  });

}

function createTLCard(ev){
  const div=document.createElement('div');div.className='tl-card';
  div.innerHTML=\`<div class="tl-thumb-ph" id="th-ph-\${ev.id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>

  fetchWikiImage(ev.wiki).then(url=>{if(!url)return;const img=document.getElementById('th-'+ev.id),ph=document.getElementById('th-ph-'+ev.id);if(img&&ph){img.src=url;img.style.display='block';img.onload=()=>{ph.style.display='none';};}});
  return div;
}

function addInsertZone(tl,idx,before,after){
  const zone=document.createElement('div');zone.className='insert-zone'+(locked?' disabled':'');
  zone.innerHTML='<div class="insert-btn">+</div>';
  zone.addEventListener('mouseenter',()=>{if(!locked)playSound('tick');});
  zone.addEventListener('click',()=>attemptPlace(idx,before,after));
  tl.appendChild(zone);
}

function attemptPlace(idx,before,after){
  if(locked||!current)return;locked=true;
  const y=current.year;
  const minY=before?before.year:-Infinity;
  const maxY=after?after.year:Infinity;
  // FIX: same-year adjacent events → always correct
  const correct=y>=minY&&y<=maxY;
  gameHistory.push({event:current,wasCorrect:correct});
  placed.push(current);
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  const tl=document.getElementById('timeline');tl.innerHTML='<div class="timeline-line"></div>';
  sorted.forEach(ev=>{const c=createTLCard(ev);if(ev===current)c.classList.add(correct?'correct':'wrong');tl.appendChild(c);});
  if(correct){score++;streak++;playSound('correct');}else{lives--;streak=0;playSound('wrong');}
  updateHUD();
  const yStr=fmtYear(current.year);
  const zh=currentLang==='zh';
  showFeedback(correct?'✓ '+(zh?'正确！'+yStr:'Correct! '+yStr):'✗ '+(zh?'应为'+yStr:'It was '+yStr),correct?'correct':'wrong');
  setTimeout(()=>{hideFeedback();if(lives<=0||deck.length===0){endGame();return;}nextCard();},1700);
}

  const msgs=zh?msgs_zh:msgs_en;
  let msg=msgs[0][1];for(const[n,m]of msgs)if(score>=n)msg=m;

}

// ── SOUND ENGINE ──────────────────────────────────────
const AC = window.AudioContext ? new AudioContext() : null;
function playSound(type) {
  if(!AC) return;
  if(AC.state==='suspended') AC.resume();
  const t=AC.currentTime, osc=AC.createOscillator(), gain=AC.createGain();
  osc.connect(gain); gain.connect(AC.destination);
  if(type==='correct'){
    osc.type='sine';
    osc.frequency.setValueAtTime(523,t); osc.frequency.setValueAtTime(659,t+0.1); osc.frequency.setValueAtTime(784,t+0.2);
    gain.gain.setValueAtTime(0.18,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.start(t); osc.stop(t+0.5);
  } else if(type==='wrong'){
    osc.type='sawtooth'; osc.frequency.setValueAtTime(220,t); osc.frequency.setValueAtTime(180,t+0.1);
    gain.gain.setValueAtTime(0.12,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    osc.start(t); osc.stop(t+0.35);
  } else if(type==='tick'){
    osc.type='sine'; osc.frequency.setValueAtTime(800,t);
    gain.gain.setValueAtTime(0.06,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    osc.start(t); osc.stop(t+0.05);
  } else if(type==='start'){
    [261,329,392,523].forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t+i*0.1); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.3);
      o.start(t+i*0.1); o.stop(t+i*0.1+0.3);
    });
  } else if(type==='gameover'){
    [392,349,311,261].forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t+i*0.15); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+0.4);
      o.start(t+i*0.15); o.stop(t+i*0.15+0.4);
    });
  }
}

// ── POOL BUILDING ──────────────────────────────────────
function buildPool() {
  const cap = DIFF_CAPS[currentDiff];
  let pool = EVENTS.filter(ev => {
    const regionOk = currentRegion==='all' || ev.regions.includes(currentRegion);
    const unitOk   = currentUnit==='all'   || ev.unit===currentUnit;
    return regionOk && unitOk;
  });
  pool.sort((a,b) => b.importance-a.importance || a.year-b.year);
  return pool.slice(0, Math.min(cap, pool.length));
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame() {
  document.getElementById('startscreen').classList.add('hide');
  document.getElementById('gameover').classList.add('hide');
  hideReview();
  const pool=buildPool();
  deck=shuffle(pool);
  placed=[];score=0;streak=0;lives=3;locked=false;gameHistory=[];
  updateHUD(); document.getElementById('pool-size').textContent=pool.length;
  const first=deck.shift();
  placed.push(first); gameHistory.push({event:first,wasCorrect:true});
  renderTimeline(); nextCard(); updateUI(); playSound('start');
}

function fmtYear(y){
  if(currentLang==='zh') return y<0?'公元前'+Math.abs(y)+'年':'公元'+y+'年';
  return y<0?Math.abs(y)+' BCE':y+' CE';
}

const imgCache=new Map();
async function fetchWikiImage(wiki){
  if(imgCache.has(wiki))return imgCache.get(wiki);
  try{
    const title=wiki.replace(/_/g,' ');
    const url=\`https://en.wikipedia.org/w/api.php?action=query&titles=\${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=400&origin=*\`;
    const r=await fetch(url);
    const d=await r.json();
    const pages=d.query?.pages;
    const page=pages?Object.values(pages)[0]:null;
    const imgUrl=page?.thumbnail?.source||null;
    imgCache.set(wiki,imgUrl); return imgUrl;
  }catch{imgCache.set(wiki,null); return null;}
}

async function nextCard(){
  if(deck.length===0||lives===0){endGame();return;}
  current=deck.shift();
  document.getElementById('card-title').textContent=getTitle(current);
  document.getElementById('card-hint').textContent=getHint(current);
  // Badge hidden on current card — would reveal unit/region hints
  document.getElementById('card-region-badge').textContent='';
  locked=false;
  const img=document.getElementById('card-img'), ph=document.getElementById('card-img-ph');
  img.classList.remove('loaded'); img.src=''; ph.style.display='flex';
  fetchWikiImage(current.wiki).then(url=>{
    if(url&&current){img.src=url;img.onload=()=>{img.classList.add('loaded');ph.style.display='none';};}
  });
  renderTimeline();
}

function renderTimeline(){
  const tl=document.getElementById('timeline'); tl.innerHTML='<div class="timeline-line"></div>';
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  if(!sorted.length){if(current&&!locked)addInsertZone(tl,0,null,null);return;}
  if(current&&!locked) addInsertZone(tl,0,null,sorted[0]);
  sorted.forEach((ev,i)=>{
    tl.appendChild(createTLCard(ev));
    if(current&&!locked&&i<sorted.length-1) addInsertZone(tl,i+1,sorted[i],sorted[i+1]);
  });
  if(current&&!locked) addInsertZone(tl,sorted.length,sorted[sorted.length-1],null);
}

function createTLCard(ev){
  const div=document.createElement('div'); div.className='tl-card';
  div.innerHTML=\`<div class="tl-thumb-ph" id="th-ph-\${ev.id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <img class="tl-thumb" id="th-\${ev.id}" src="" alt="" style="display:none">
    <div class="tl-body"><span class="tl-card-year">\${fmtYear(ev.year)}</span><span class="tl-card-title">\${getTitle(ev)}</span>
    <a class="tl-card-wiki" href="https://en.wikipedia.org/wiki/\${encodeURIComponent(ev.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a></div>\`;
  fetchWikiImage(ev.wiki).then(url=>{if(!url)return;const img=document.getElementById('th-'+ev.id),ph=document.getElementById('th-ph-'+ev.id);if(img&&ph){img.src=url;img.style.display='block';img.onload=()=>ph.style.display='none';}});
  return div;
}

function addInsertZone(tl,idx,before,after){
  const zone=document.createElement('div'); zone.className='insert-zone'+(locked?' disabled':'');
  zone.innerHTML='<div class="insert-btn">+</div>';
  zone.addEventListener('mouseenter',()=>{if(!locked)playSound('tick');});
  zone.addEventListener('click',()=>attemptPlace(idx,before,after));
  tl.appendChild(zone);
}

function attemptPlace(idx,before,after){
  if(locked||!current)return; locked=true;
  const y=current.year;
  const minY=before?before.year:-Infinity, maxY=after?after.year:Infinity;
  const correct=y>=minY&&y<=maxY;
  gameHistory.push({event:current,wasCorrect:correct});
  placed.push(current);
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  const tl=document.getElementById('timeline'); tl.innerHTML='<div class="timeline-line"></div>';
  sorted.forEach(ev=>{const c=createTLCard(ev);if(ev===current)c.classList.add(correct?'correct':'wrong');tl.appendChild(c);});
  if(correct){score++;streak++;playSound('correct');}else{lives--;streak=0;playSound('wrong');}
  updateHUD();
  const yStr=fmtYear(current.year); const zh=currentLang==='zh';
  showFeedback(correct?'✓ '+(zh?'正确！'+yStr:'Correct! '+yStr):'✗ '+(zh?'应为'+yStr:'It was '+yStr),correct?'correct':'wrong');
  setTimeout(()=>{hideFeedback();if(lives<=0||deck.length===0){endGame();return;}nextCard();},1700);
}

// ── SOUND ENGINE ──────────────────────────────────────
const AC = window.AudioContext ? new AudioContext() : null;
function playSound(type) {
  if(!AC) return;
  if(AC.state==='suspended') AC.resume();
  const t=AC.currentTime, osc=AC.createOscillator(), gain=AC.createGain();
  osc.connect(gain); gain.connect(AC.destination);
  if(type==='correct'){
    osc.type='sine';
    osc.frequency.setValueAtTime(523,t); osc.frequency.setValueAtTime(659,t+0.1); osc.frequency.setValueAtTime(784,t+0.2);
    gain.gain.setValueAtTime(0.18,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.start(t); osc.stop(t+0.5);
  } else if(type==='wrong'){
    osc.type='sawtooth'; osc.frequency.setValueAtTime(220,t); osc.frequency.setValueAtTime(180,t+0.1);
    gain.gain.setValueAtTime(0.12,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    osc.start(t); osc.stop(t+0.35);
  } else if(type==='tick'){
    osc.type='sine'; osc.frequency.setValueAtTime(800,t);
    gain.gain.setValueAtTime(0.06,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    osc.start(t); osc.stop(t+0.05);
  } else if(type==='start'){
    [261,329,392,523].forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t+i*0.1); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.3);
      o.start(t+i*0.1); o.stop(t+i*0.1+0.3);
    });
  } else if(type==='gameover'){
    [392,349,311,261].forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t+i*0.15); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+0.4);
      o.start(t+i*0.15); o.stop(t+i*0.15+0.4);
    });
  }
}

function buildPool() {
  const cap = DIFF_CAPS[currentDiff];
  let pool = EVENTS.filter(ev => currentUnit==='all' || ev.unit===currentUnit);
  pool.sort((a,b) => b.importance-a.importance || a.year-b.year);
  return pool.slice(0, Math.min(cap, pool.length));
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

const imgCache=new Map();
async function fetchWikiImage(wiki){
  if(imgCache.has(wiki)) return imgCache.get(wiki);
  try{
    const title = wiki.replace(/_/g,' ');
    const url = \`https://en.wikipedia.org/api/rest_v1/page/summary/\${encodeURIComponent(title)}\`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if(!r.ok) throw new Error('summary fetch failed');
    const d = await r.json();
    const imgUrl = d?.thumbnail?.source || d?.originalimage?.source || null;
    imgCache.set(wiki, imgUrl);
    return imgUrl;
  }catch(err){
    console.warn('fetchWikiImage failed for', wiki, err);
    imgCache.set(wiki, null);
    return null;
  }
}

function attachImage(img, ph, url, displayMode='block'){
  if(!img || !ph || !url) return;
  img.classList.remove('loaded');
  img.style.display = 'none';
  ph.style.display = 'flex';

  const finish = () => {
    img.classList.add('loaded');
    img.style.display = displayMode;
    ph.style.display = 'none';
  };

  img.onload = finish;
  img.onerror = () => {
    ph.style.display = 'flex';
    img.style.display = 'none';
  };

  // Assign src after handlers are attached, and handle cached images.
  if(img.src !== url) img.src = url;

  if(img.complete && img.naturalWidth > 0){
    finish();
  }
}


async function nextCard(){
  if(deck.length===0||lives===0){endGame();return;}
  current=deck.shift();
  document.getElementById('card-title').textContent=getTitle(current);
  document.getElementById('card-hint').textContent=getHint(current);
  // Badge hidden on current card — keep the challenge focused on chronology
  document.getElementById('card-region-badge').textContent='';
  locked=false;
  const img=document.getElementById('card-img'), ph=document.getElementById('card-img-ph');
  img.classList.remove('loaded'); img.src=''; ph.style.display='flex';
  fetchWikiImage(current.wiki).then(url=>{
    if(url&&current){img.src=url;img.onload=()=>{img.classList.add('loaded');ph.style.display='none';};}
  });
  renderTimeline();
}

function renderTimeline(){
  const tl=document.getElementById('timeline'); tl.innerHTML='<div class="timeline-line"></div>';
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  if(!sorted.length){if(current&&!locked)addInsertZone(tl,0,null,null);return;}
  if(current&&!locked) addInsertZone(tl,0,null,sorted[0]);
  sorted.forEach((ev,i)=>{
    tl.appendChild(createTLCard(ev));
    if(current&&!locked&&i<sorted.length-1) addInsertZone(tl,i+1,sorted[i],sorted[i+1]);
  });
  if(current&&!locked) addInsertZone(tl,sorted.length,sorted[sorted.length-1],null);
}

function createTLCard(ev){
  const div=document.createElement('div'); div.className='tl-card';
  div.innerHTML=\`<div class="tl-thumb-ph" id="th-ph-\${ev.id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <img class="tl-thumb" id="th-\${ev.id}" src="" alt="" style="display:none">
    <div class="tl-body"><span class="tl-card-year">\${fmtYear(ev.year)}</span><span class="tl-card-title">\${getTitle(ev)}</span>
    <a class="tl-card-wiki" href="https://en.wikipedia.org/wiki/\${encodeURIComponent(ev.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a></div>\`;
  fetchWikiImage(ev.wiki).then(url=>{if(!url)return;const img=document.getElementById('th-'+ev.id),ph=document.getElementById('th-ph-'+ev.id);if(img&&ph){img.src=url;img.style.display='block';img.onload=()=>ph.style.display='none';}});
  return div;
}

function addInsertZone(tl,idx,before,after){
  const zone=document.createElement('div'); zone.className='insert-zone'+(locked?' disabled':'');
  zone.innerHTML='<div class="insert-btn">+</div>';
  zone.addEventListener('mouseenter',()=>{if(!locked)playSound('tick');});
  zone.addEventListener('click',()=>attemptPlace(idx,before,after));
  tl.appendChild(zone);
}

function attemptPlace(idx,before,after){
  if(locked||!current)return; locked=true;
  const y=current.year;
  const minY=before?before.year:-Infinity, maxY=after?after.year:Infinity;
  const correct=y>=minY&&y<=maxY;
  gameHistory.push({event:current,wasCorrect:correct});
  placed.push(current);
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  const tl=document.getElementById('timeline'); tl.innerHTML='<div class="timeline-line"></div>';
  sorted.forEach(ev=>{const c=createTLCard(ev);if(ev===current)c.classList.add(correct?'correct':'wrong');tl.appendChild(c);});
  if(correct){score++;streak++;playSound('correct');}else{lives--;streak=0;playSound('wrong');}
  updateHUD();
  const yStr=fmtYear(current.year); const zh=currentLang==='zh';
  showFeedback(correct?'✓ '+(zh?'正确！'+yStr:'Correct! '+yStr):'✗ '+(zh?'应为'+yStr:'It was '+yStr),correct?'correct':'wrong');
  setTimeout(()=>{hideFeedback();if(lives<=0||deck.length===0){endGame();return;}nextCard();},1700);
}

async function getWikipediaImage(title){
  try{
    const encoded = encodeURIComponent(title);
    const url = \`https://en.wikipedia.org/api/rest_v1/page/summary/\${encoded}\`;
    const res = await fetch(url, {
      headers: {
        'Accept': 'application/json'
      }
    });
    if(!res.ok) throw new Error('wiki fetch failed');
    const data = await res.json();

    if(data.thumbnail && data.thumbnail.source){
      return data.thumbnail.source.replace(/\\/\\d+px-/,'/320px-');
    }

    if(data.originalimage && data.originalimage.source){
      return data.originalimage.source;
    }

    return null;
  }catch(err){
    console.warn('Image load failed for', title, err);
    return null;
  }
}

// ── WIKI IMAGE ──
async function fetchWikiImage(slug){
  try{
    const title=decodeWiki(slug);
    const r=await fetch(\`https://en.wikipedia.org/api/rest_v1/page/summary/\${encodeURIComponent(title)}\`);
    if(!r.ok)return null;
    const d=await r.json();
    return d.thumbnail?.source||null;
  }catch{return null;}
}

// ── SOUND ──
let audioCtx=null;
function playSound(t){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const ctx=audioCtx,o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    const now=ctx.currentTime;
    if(t==='correct'){o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+.1);o.frequency.setValueAtTime(784,now+.2);g.gain.setValueAtTime(.12,now);g.gain.exponentialRampToValueAtTime(.001,now+.5);}
    else if(t==='wrong'){o.frequency.setValueAtTime(220,now);o.frequency.setValueAtTime(180,now+.15);g.gain.setValueAtTime(.15,now);g.gain.exponentialRampToValueAtTime(.001,now+.4);}
    else if(t==='tick'){o.frequency.setValueAtTime(900,now);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.001,now+.07);}
    else if(t==='over'){o.frequency.setValueAtTime(330,now);o.frequency.setValueAtTime(262,now+.2);g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.001,now+.6);}
    o.start(now);o.stop(now+.7);
  }catch{}
}

}

function showStartScreen(){
  document.getElementById('gameover').classList.add('hide');
  document.getElementById('review-screen').classList.remove('show');
  document.getElementById('startscreen').classList.remove('hide');
  updateUI();
}

function startGame(){
  const pool=getFilteredPool();
  if(pool.length<3){
    alert(currentLang==='zh'?'事件池太小，请调整筛选条件！':'Pool too small — please adjust your filters!');
    return;
  }
  document.getElementById('startscreen').classList.add('hide');
  deck=shuffle([...pool]);
  placed=[];current=null;locked=false;score=0;streak=0;lives=3;gameHistory=[];
  document.getElementById('score').textContent='0';
  document.getElementById('streak').textContent='—';
  document.getElementById('pool-size').textContent=deck.length;
  document.getElementById('progress').style.width='0%';
  const tl=document.getElementById('timeline');
  tl.innerHTML='<div class="timeline-line"></div>';
  buildHearts();
  nextCard();
}

function nextCard(){
  if(deck.length===0){endGame();return;}
  locked=false;
  current=deck.pop();
  document.getElementById('pool-size').textContent=deck.length;

  // Auto-place the very first card as a reference anchor — no scoring needed
  if(placed.length===0){
    placed.push(current);
    gameHistory.push({event:current,wasCorrect:true});
    buildTimeline();
    current=null;
    if(deck.length===0){endGame();return;}
    current=deck.pop();
    document.getElementById('pool-size').textContent=deck.length;
  }

  // Display the challenge card
  document.getElementById('card-title').textContent=getTitle(current);
  document.getElementById('card-hint').textContent=getHint(current);
  const rl=REGION_LABELS[currentLang==='zh'?'zh':'en'];
  document.getElementById('card-region-badge').textContent=current.regions.map(r=>rl[r]||r).join(' · ');
  const img=document.getElementById('card-img'),ph=document.getElementById('card-img-ph');
  img.classList.remove('loaded');img.src='';ph.style.display='flex';
  fetchWikiImage(current.wiki).then(url=>{
    if(url&&current){img.src=url;img.onload=()=>{img.classList.add('loaded');ph.style.display='none';};}
  });
  buildTimeline();
}

// ── TIMELINE ──
function buildTimeline(){
  const tl=document.getElementById('timeline');
  tl.innerHTML='<div class="timeline-line"></div>';
  const sorted=[...placed].sort((a,b)=>a.year-b.year);
  if(!sorted.length){addZone(tl,0,null,null);return;}
  addZone(tl,0,null,sorted[0]);
  sorted.forEach((ev,i)=>{
    tl.appendChild(makeTLCard(ev,false));
    if(i<sorted.length-1)addZone(tl,i+1,sorted[i],sorted[i+1]);
  });
  addZone(tl,sorted.length,sorted[sorted.length-1],null);
}

function makeTLCard(ev,highlight){
  const div=document.createElement('div');
  div.className='tl-card'+(highlight?' '+highlight:'');
  div.innerHTML=\`
    <div class="tl-thumb-ph" id="thph-\${ev.id}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <img class="tl-thumb" id="th-\${ev.id}" src="" alt="" style="display:none">
    <div class="tl-body">
      <span class="tl-card-year">\${fmtYear(ev.year)}</span>
      <span class="tl-card-title">\${getTitle(ev)}</span>
      <a class="tl-card-wiki" href="\${wikiURL(ev.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a>
    </div>\`;
  fetchWikiImage(ev.wiki).then(url=>{
    if(!url)return;
    const img=document.getElementById('th-'+ev.id),ph=document.getElementById('thph-'+ev.id);
    if(img&&ph){img.src=url;img.onload=()=>{img.style.display='block';ph.style.display='none';};}
  });
  return div;
}

function addZone(tl,idx,before,after){
  if(locked){return;}
  const z=document.createElement('div');
  z.className='insert-zone';
  z.innerHTML='<div class="insert-btn">+</div>';
  z.addEventListener('mouseenter',()=>playSound('tick'));
  z.addEventListener('click',()=>attemptPlace(idx,before,after));
  tl.appendChild(z);
}

// ── PLACEMENT ──
function attemptPlace(idx,before,after){
  if(locked||!current)return;
  locked=true;
  const y=current.year;
  const minY=before?before.year:-Infinity;
  const maxY=after?after.year:Infinity;
  const correct=(y>=minY&&y<=maxY);
  const ev=current;
  gameHistory.push({event:ev,wasCorrect:correct});
  placed.push(ev);
  // Rebuild timeline with flash
  const tl=document.getElementById('timeline');
  tl.innerHTML='<div class="timeline-line"></div>';
  [...placed].sort((a,b)=>a.year-b.year).forEach(e=>{
    tl.appendChild(makeTLCard(e,e===ev?(correct?'correct':'wrong'):null));
  });
  if(correct){score++;streak++;playSound('correct');}
  else{lives=Math.max(0,lives-1);streak=0;playSound('wrong');}
  updateHUD();
  const zh=currentLang==='zh';
  showFeedback(
    correct?'✓ '+(zh?'正确！':'Correct! ')+fmtYear(ev.year)
           :'✗ '+(zh?'正确年份：':'It was ')+fmtYear(ev.year),
    correct?'correct':'wrong'
  );
  setTimeout(()=>{
    hideFeedback();
    if(lives<=0||deck.length===0){endGame();}
    else{nextCard();}
  },1700);
}

function showFeedback(msg,type){
  const f=document.getElementById('feedback');
  f.textContent=msg;f.className='feedback '+type;
}
function hideFeedback(){
  document.getElementById('feedback').className='feedback hide';
}

// ── GAME OVER ──
function endGame(){
  current=null;
  playSound('over');
  const zh=currentLang==='zh';
  const msgs_en=[[0,"Keep studying — European history rewards persistence!"],[5,"Good start — keep reviewing the AP CED"],[10,"Solid command of AP European History"],[20,"Impressive! You're AP exam ready"],[30,"Outstanding! Hall of Fame European historian"]];
  const msgs_zh=[[0,"继续学习——欧洲历史值得坚持！"],[5,"好的开始——继续复习AP考纲"],[10,"对AP欧洲史掌握扎实"],[20,"令人印象深刻！你已准备好参加AP考试"],[30,"出类拔萃！欧洲史名人堂级别"]];
  const msgs=zh?msgs_zh:msgs_en;
  let msg=msgs[0][1];
  for(const[n,m]of msgs)if(score>=n)msg=m;
  document.getElementById('go-title').textContent=zh?'练习完成':'Practice Complete';
  document.getElementById('final-score').textContent=score;
  document.getElementById('final-msg').textContent=zh
    ?msg+' — 共成功放置 '+score+' 个事件'
    :msg+' — '+score+' event'+(score===1?'':'s')+' placed correctly';
  document.getElementById('go-review').textContent=zh?'回顾时间轴 ›':'Review Timeline ›';
  document.getElementById('go-again').textContent=zh?'再练一次':'Practice Again';
  document.getElementById('gameover').classList.remove('hide');
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'histoScore',game:'europe',score:score},'*');}catch(e){}
}

// ── REVIEW ──
function showReview(){
  document.getElementById('gameover').classList.add('hide');
  document.getElementById('review-screen').classList.add('show');
  const zh=currentLang==='zh';
  const correct=gameHistory.filter(h=>h.wasCorrect).length;
  document.getElementById('rev-title').textContent=zh?'你的时间轴':'Your Timeline';
  document.getElementById('review-stats').textContent=zh
    ?\`\${gameHistory.length} 个事件中答对 \${correct} 个（\${Math.round(correct/gameHistory.length*100)||0}%）\`
    :\`\${correct} of \${gameHistory.length} placed correctly (\${Math.round(correct/gameHistory.length*100)||0}%)\`;
  document.getElementById('rev-lbl1').textContent=zh?'你放置的事件（按时间顺序）':'Events you placed — in chronological order';
  document.getElementById('rev-lbl2').textContent=zh?'所有事件图集':'All events — gallery view';
  document.getElementById('rev-again').textContent=zh?'再练一次 ›':'Practice Again ›';
  document.getElementById('rev-back').textContent=zh?'返回结果':'Back to Results';

  // Horizontal mini-timeline
  const tl=document.getElementById('review-tl');
  tl.innerHTML='';
  const sorted=[...gameHistory].sort((a,b)=>a.event.year-b.event.year);
  const un=UNIT_NAMES[zh?'zh':'en'];
  sorted.forEach(h=>{
    const ev=h.event;
    const card=document.createElement('div');
    card.className='review-tl-card';
    card.innerHTML=\`
      <div class="review-tl-dot \${h.wasCorrect?'ok':'bad'}"></div>
      <div class="review-tl-img-ph" id="rtlph-\${ev.id}"></div>
      <img class="review-tl-img" id="rtli-\${ev.id}" src="" alt="" style="display:none">
      <span class="review-tl-year">\${fmtYear(ev.year)}</span>
      <div class="review-tl-name">\${getTitle(ev)}</div>
      <div style="font-size:.55rem;color:var(--ink3);margin:1px 0">\${un[ev.unit]||ev.unit}</div>
      <a class="review-tl-link" href="\${wikiURL(ev.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a>\`;
    tl.appendChild(card);
    fetchWikiImage(ev.wiki).then(url=>{
      if(!url)return;
      const img=document.getElementById('rtli-'+ev.id),ph=document.getElementById('rtlph-'+ev.id);
      if(img&&ph){img.src=url;img.onload=()=>{img.style.display='block';ph.style.display='none';};}
    });
  });

  // Gallery grid
  const grid=document.getElementById('review-grid');
  grid.innerHTML='';
  sorted.forEach(h=>{
    const ev=h.event;
    const card=document.createElement('div');
    card.className='review-card '+(h.wasCorrect?'correct-card':'wrong-card');
    card.innerHTML=\`
      <div class="review-card-ph" id="rgph-\${ev.id}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <img id="rgi-\${ev.id}" src="" alt="" style="display:none;width:100%;height:80px;object-fit:cover">
      <div class="review-card-body">
        <span class="review-card-year">\${fmtYear(ev.year)} \${h.wasCorrect?'✅':'❌'}</span>
        <div class="review-card-title">\${getTitle(ev)}</div>
        <div style="font-size:.58rem;color:var(--ink3);margin:.1rem 0">\${un[ev.unit]||ev.unit}</div>
        <a class="review-card-wiki" href="\${wikiURL(ev.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a>
      </div>\`;
    grid.appendChild(card);
    fetchWikiImage(ev.wiki).then(url=>{
      if(!url)return;
      const img=document.getElementById('rgi-'+ev.id),ph=document.getElementById('rgph-'+ev.id);
      if(img&&ph){img.src=url;img.onload=()=>{img.style.display='block';ph.style.display='none';};}

// ── Blob URL cache ──────────────────────────────────────
const GAME_MAP = {
  ultimate: GAME_ULTIMATE,
  world:    GAME_WORLD,
  us:       GAME_US,
  europe:   GAME_EUROPE
};
const blobCache = {};
function gameUrl(id) {
  if (!blobCache[id]) {
    const blob = new Blob([GAME_MAP[id]], {type:'text/html;charset=utf-8'});
    blobCache[id] = URL.createObjectURL(blob);
  }
  return blobCache[id];
}

// ── High scores (localStorage) ──────────────────────────
const SK = 'histoTrivia_v1_scores';
function loadScores() {
  try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch(e) { return {}; }
}
function saveScore(game, score) {
  const s = loadScores();
  if (s[game] == null || score > s[game]) {
    s[game] = score;
    localStorage.setItem(SK, JSON.stringify(s));
  }
  return loadScores()[game];
}
function refreshUI() {
  const s = loadScores();
  ['ultimate','world','us','europe'].forEach(id => {
    const el = document.getElementById('sv-'+id);
    if (el) el.textContent = (s[id] != null) ? s[id] : '—';
  });
}
refreshUI();

// ── postMessage from iframe games ──────────────────────
window.addEventListener('message', ev => {
  if (!ev.data || ev.data.type !== 'histoScore') return;
  const {game, score} = ev.data;
  const best = saveScore(game, score);
  refreshUI();
  const bv = document.getElementById('bar-best-val');
  if (bv) bv.textContent = best;
  document.getElementById('bar-best').style.display = '';
});

// ── Navigation ─────────────────────────────────────────
const NAMES = {ultimate:'终极挑战', world:'AP 世界史', us:'AP 美国史', europe:'AP 欧洲史'};
let currentGame = null;

function launchGame(id) {
  currentGame = id;
  const frame = document.getElementById('game-frame');
  frame.src = gameUrl(id);

  document.getElementById('bar-title').textContent = NAMES[id];
  const s = loadScores();
  const bv  = document.getElementById('bar-best-val');
  const bb  = document.getElementById('bar-best');
  if (s[id] != null) { bv.textContent = s[id]; bb.style.display = ''; }
  else { bb.style.display = 'none'; }

  document.getElementById('portal').style.display = 'none';
  document.getElementById('game-shell').classList.add('active');
}

function returnPortal() {
  document.getElementById('game-shell').classList.remove('active');
  document.getElementById('portal').style.display = 'flex';
  // Stop game (blank iframe so audio/timers inside stop)
  document.getElementById('game-frame').src = 'about:blank';
  currentGame = null;
  refreshUI();
}

// ── Canon in D — Web Audio API Synthesizer ───────────────
(function(){
  // Note frequencies (Hz)
  const N = {
    D2:73.42, Gb2:92.50, G2:98.00, A2:110.00, B2:123.47,
    D3:146.83, E3:164.81, Gb3:185.00, G3:196.00, A3:220.00, B3:246.94,
    Db4:277.18, D4:293.66, E4:329.63, Gb4:370.00, G4:392.00, A4:440.00, B4:493.88,
    Db5:554.37, D5:587.33, E5:659.25
  };

  // Bass ostinato: D A B F# G D G A (each = 2 beats)
  const BASS = [N.D2, N.A2, N.B2, N.Gb2, N.G2, N.D2, N.G2, N.A2];

  // 4 melody variations (each = 8 quarter notes = 8 beats = 1 bass cycle)
  const VARS = [
    [N.Gb4, N.E4,  N.D4,  N.Db4, N.B3,  N.A3,  N.B3,  N.Db4], // var 1
    [N.D4,  N.Db4, N.B3,  N.A3,  N.G3,  N.Gb3, N.G3,  N.A3 ], // var 2
    [N.Gb4, N.Gb4, N.E4,  N.E4,  N.D4,  N.D4,  N.Db4, N.Db4], // var 3
    [N.B3,  N.B3,  N.A3,  N.A3,  N.G3,  N.G3,  N.Gb3, N.Gb3], // var 4
  ];

  // Alto voice (2 beats each, same grid as bass)
  const ALTO = [N.D4, N.A3, N.B3, N.Gb3, N.G3, N.D4, N.G3, N.A3];

  const BPM = 78, BEAT = 60 / BPM;
  let ctx = null, masterGain = null, running = false;
  let nextT = 0, pumpTimer = null, cycleN = 0;

  function playNote(freq, t, dur, type, vol) {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + 0.014);
    env.gain.setValueAtTime(vol * 0.72, t + dur * 0.35);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.97);
    osc.connect(env); env.connect(masterGain);
    osc.start(t); osc.stop(t + dur + 0.04);
  }

  function scheduleCycle(t) {
    const mel = VARS[cycleN % VARS.length];
    // Bass
    BASS.forEach((f, i) => playNote(f, t + i*BEAT*2, BEAT*1.85, 'sine', 0.38));
    // Melody
    mel.forEach((f, i)  => playNote(f, t + i*BEAT,   BEAT*0.82, 'triangle', 0.20));
    // Alto
    ALTO.forEach((f, i) => playNote(f, t + i*BEAT*2, BEAT*1.70, 'triangle', 0.13));
    cycleN++;
    return BASS.length * BEAT * 2; // cycle duration
  }

  function pump() {
    if (!running) return;
    while (nextT < ctx.currentTime + 4) {
      const d = scheduleCycle(nextT); nextT += d;
    }
    pumpTimer = setTimeout(pump, 1200);
  }

  const mbtn = document.getElementById('mbtn');

  window.canonPlayer = {
    start() {
      if (running) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = document.getElementById('vol').value / 100 * 0.6;
      masterGain.connect(ctx.destination);
      running = true; cycleN = 0;
      nextT = ctx.currentTime + 0.08;
      pump();
      mbtn.textContent = '🎵'; mbtn.style.opacity = '1';
    },
    stop() {
      running = false;
      if (pumpTimer) clearTimeout(pumpTimer);
      if (ctx) { ctx.close(); ctx = null; masterGain = null; }
      mbtn.textContent = '♪'; mbtn.style.opacity = '.5';
    },
    setVolume(v) {
      if (masterGain) masterGain.gain.value = v * 0.6;
    },
    get playing() { return running; }
  };
})();

function toggleMusic() {
  if (canonPlayer.playing) { canonPlayer.stop(); }
  else { canonPlayer.start(); }
}

function setVol(v) { canonPlayer.setVolume(v / 100); }

// Auto-start on first interaction
let gestured = false;
document.addEventListener('click', () => {
  if (!gestured) { gestured = true; canonPlayer.start(); }
}, {once: true});
